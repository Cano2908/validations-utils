syntax = "proto3";

package kguard.validation.v1;

option java_package = "com.kuantik.grpc.v1";
option java_outer_classname = "ValidatorProto";
option java_multiple_files = true;

service Validator {
  rpc Validate(ValidateRequest) returns (ValidateResponse);
}

message ValidateRequest {
  string job_id = 1;
  string company_id = 2;
  string xml_content = 3;
  string category_id = 4;
  string trace_id = 5;
  string json_content = 6;
  repeated string rule_codes = 7;
}

message ValidateResponse {
  string validator_id = 1;
  string category_id = 2;
  string status = 3;
  repeated FindingProto findings = 4;
  int64  duration_ms = 5;
  string error_message = 6;
}

message FindingProto {
  string rule_id = 1;
  string rule_code = 2;
  string severity = 3;
  string message = 4;
  string xpath = 5;
  string detail = 6;
  string label = 7;
  string metadata_json = 8;
}
